# Production entry point for the whole app - serves the built React SPA
# and reverse-proxies the API/SignalR hub, so the browser only ever
# talks to this one origin. See docker-compose.prod.yml for how the
# cert directory and the api service get wired in.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Same cert/key pair the dev Vite server already uses locally (see
    # .env.example's HTTPS_CERT_DIR) - a real domain later just means
    # pointing that directory at a real certificate, not touching this
    # file.
    ssl_certificate     /etc/nginx/certs/arcanum-lan.crt;
    ssl_certificate_key /etc/nginx/certs/arcanum-lan.key;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # react-router handles routing client-side - any path that isn't a
    # real static file falls back to index.html instead of 404ing on a
    # refresh at e.g. /app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 16m;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR needs the WebSocket upgrade headers on top of the plain
    # proxy headers above - everything else here is the same.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
