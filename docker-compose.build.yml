# Builds the production images from source instead of pulling them from GHCR.
# Use together with docker-compose.prod.yml:
#   docker compose -f docker-compose.prod.yml -f docker-compose.build.yml up --build -d

services:
    api:
        build:
            context: .
            dockerfile: ArcanumMessenger.Api/Dockerfile

    client:
        build:
            context: ./ArcanumMessenger.Client
            dockerfile: Dockerfile.prod
