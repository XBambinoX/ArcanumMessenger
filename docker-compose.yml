services:
    api:
        build:
            context: .
            dockerfile: ArcanumMessenger.Api/Dockerfile
        container_name: arcanum-api
        ports:
            - "5135:8080"
            - "7039:8081"
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_URLS: https://+:8081;http://+:8080
            ASPNETCORE_Kestrel__Certificates__Default__Path: ${KESTREL_CERT_PATH}
            ASPNETCORE_Kestrel__Certificates__Default__Password: ${KESTREL_CERT_PASSWORD}
        volumes:
            - ${HOME}/.aspnet/https:/https:ro
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    client:
        build:
            context: ./ArcanumMessenger.Client
            dockerfile: Dockerfile
        container_name: arcanum-client
        ports:
            - "5173:5173"
        environment:
            API_URL: http://api:8080
        volumes:
            - ./ArcanumMessenger.Client:/app
            - /app/node_modules
        depends_on:
            - api

