services:
    api:
        build:
            context: .
            dockerfile: ArcanumMessenger.Api/Dockerfile
        container_name: arcanum-api
        ports:
            - "5135:8080"
            - "7039:8081"
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_URLS: https://+:8081;http://+:8080
            ASPNETCORE_Kestrel__Certificates__Default__Path: ${KESTREL_CERT_PATH}
            ASPNETCORE_Kestrel__Certificates__Default__Password: ${KESTREL_CERT_PASSWORD}
            ConnectionStrings__Postgres: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
            ConnectionStrings__Redis: redis:6379

            Smtp__Host: smtp.gmail.com
            Smtp__Port: 587
            Smtp__Username: ${SMTP_USERNAME}
            Smtp__Password: ${SMTP_PASSWORD}
            Smtp__FromName: Arcanum Messenger

            Encryption__EmailKey: ${EMAIL_ENCRYPTION_KEY}

        volumes:
            - ${HTTPS_CERT_DIR}:/https:ro
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    client:
        build:
            context: ./ArcanumMessenger.Client
            dockerfile: Dockerfile
        container_name: arcanum-client
        ports:
            - "5173:5173"
        environment:
            API_URL: http://api:8080
        volumes:
            - ./ArcanumMessenger.Client:/app
            - /app/node_modules
        depends_on:
            - api

    db:
        image: postgres:16-alpine
        container_name: arcanum-db
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    redis:
        image: redis:7.2-alpine
        container_name: arcanum-redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s

volumes:
    postgres_data:
    redis_data:

