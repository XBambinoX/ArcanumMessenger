# Builds the installer for each platform and attaches it to the release it was triggered by.
name: Installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the binaries to (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest, asset: arcanum-linux-x64 }
          - { rid: linux-arm64, os: ubuntu-latest, asset: arcanum-linux-arm64 }
          - { rid: win-x64, os: ubuntu-latest, asset: arcanum-windows-x64.exe }
          # Apple silicon only runs signed binaries; a macOS runner signs them ad hoc while publishing
          - { rid: osx-arm64, os: macos-latest, asset: arcanum-macos-arm64 }
          - { rid: osx-x64, os: macos-latest, asset: arcanum-macos-x64 }

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: |
          dotnet publish ArcanumMessenger.Installer -c Release -r ${{ matrix.rid }} -p:Version=${TAG#v} -o out
          if [ -f out/arcanum.exe ]; then mv out/arcanum.exe "${{ matrix.asset }}"; else mv out/arcanum "${{ matrix.asset }}"; fi

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ matrix.asset }}" --clobber
